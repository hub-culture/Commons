name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python scripts/validate_registry.py
      - run: python scripts/build_lineage.py && python scripts/render_lineage_map.py
      - run: git diff --exit-code data/lineage docs/lineage-map.html
